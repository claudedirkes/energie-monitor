# Holt täglich die Tageswerte der AgriMeteo-Station Ettelbruck (seit 2004).
# Erster Lauf dauert ca. 20–30 Minuten (der Server erlaubt nur langsame Abfragen).
name: Tageswerte Ettelbruck

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/agrimeteo_tage.py', '.github/workflows/agrimeteo-tage.yml']

permissions:
  contents: write

concurrency:
  group: daten-commit
  cancel-in-progress: false

jobs:
  tage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tageswerte laden
        run: python scripts/agrimeteo_tage.py
      - name: Speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/agri
          git commit -m "Tageswerte Ettelbruck aktualisiert" || exit 0
          git pull --rebase -q && git push
