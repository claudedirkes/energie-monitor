# Einmaliger Test: Live-Werte von AgriMeteo (Ettelbruck/Bettendorf) und MeteoLux abrufbar?
name: Probe Live-Stationen
on:
  push:
    paths: ['.github/workflows/probe-live.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Laden
        run: |
          mkdir -p data/probe && cd data/probe
          B='https://www.agrimeteo.lu/Internet/AM/NotesLUAM.nsf/(XP_StationABC)/65c497a9d9603796c12577510033ad0c?OpenDocument'
          for r in 3.2 3.3; do curl -sSL -A "Mozilla/5.0" -o "ettelbruck_$r.html" -w "ettelbruck $r %{http_code} %{size_download}\n" "$B&TableRow=$r" >> status.txt 2>&1 || true; done
          curl -sSL -A "Mozilla/5.0" -o bettendorf.html -w "bettendorf %{http_code} %{size_download}\n" "https://www.agrimeteo.lu/Agrarmeteorologie/Wetterdaten/Stationen-Alphabetisch/LUAM036" >> status.txt 2>&1 || true
          curl -sS -o meteolux_obs.json -w "meteolux obs %{http_code}\n" https://metapi.ana.lu/api/v1/hvd/observations >> status.txt 2>&1 || true
          curl -sS -o meteolux_meta.json -w "meteolux meta %{http_code}\n" https://metapi.ana.lu/api/v1/hvd/observations/metadata >> status.txt 2>&1 || true
          curl -sSI https://metapi.ana.lu/api/v1/hvd/observations -H "Origin: https://claudedirkes.github.io" | grep -i "access-control" >> status.txt || echo "kein CORS-Header" >> status.txt
          date -u >> status.txt
      - name: Committen
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add data/probe; git commit -m "Probe Live-Stationen" || true; git push
