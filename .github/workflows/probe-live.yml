# Einmaliger Test: Live-Werte von AgriMeteo (Ettelbruck/Bettendorf) und MeteoLux abrufbar?
name: Probe Live-Stationen
on:
  push:
    paths: ['.github/workflows/probe-live.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Laden
        run: |
          mkdir -p data/probe && cd data/probe && rm -f *
          curl -sSL -A "Mozilla/5.0" -o ett_min5.html -w "ett min5 %{http_code} %{size_download}\n" "https://dlr-web-daten1.aspdienste.de/cgi-bin/wetter.min5.pl?c=92&sid=10&t=1,2,6,8,9&hh=24" >> status.txt 2>&1 || true
          curl -sSL -A "Mozilla/5.0" -o ett_hh.html -w "ett hh %{http_code} %{size_download}\n" "https://dlr-web-daten1.aspdienste.de/cgi-bin/wetter.hh.pl?c=92&sid=10&t=1,4,11,7" >> status.txt 2>&1 || true
          B='https://www.agrimeteo.lu/Internet/AM/NotesLUAM.nsf/(XP_StationABC)/1D9C0978978C6D7DC1257E14004D7953?OpenDocument'
          curl -sSL -A "Mozilla/5.0" -o bet_32.html -w "bet 3.2 %{http_code} %{size_download}\n" "$B&TableRow=3.2" >> status.txt 2>&1 || true
          curl -sSI "https://dlr-web-daten1.aspdienste.de/cgi-bin/wetter.hh.pl?c=92&sid=10&t=1,4,11,7" -H "Origin: https://claudedirkes.github.io" | grep -iE "access-control|content-type" >> status.txt || echo "kein CORS-Header" >> status.txt
          date -u >> status.txt
      - name: Committen
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add data/probe; git commit -m "Probe Live-Stationen" || true; git push
