# Einmaliger Test: Kann GitHub die Daten der Station meteoLCD (Diekirch) laden?
# Lädt die Startseite + Beispieldateien und legt sie unter data/probe/ ab.
name: Probe meteoLCD

on:
  push:
    paths: ['.github/workflows/probe-lcd.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dateien laden
        run: |
          mkdir -p data/probe && cd data/probe && rm -f *.dat *.xls* status.txt
          # Wohin leitet die Startseite? (Header)
          curl -sSIL -A "Mozilla/5.0" https://meteo.lcd.lu/ | grep -iE "^(HTTP|location|content-location)" > status.txt || true
          for u in \
            https://meteo.lcd.lu/today.dat \
            https://meteo.lcd.lu/2026/aug26.dat \
            https://meteo.lcd.lu/data/2026/aug26.dat \
            https://meteo.lcd.lu/data/aug26.dat \
            https://meteo.lcd.lu/ALL_dat/all_2024.dat \
            https://meteo.lcd.lu/data/ALL_dat/all_2024.dat \
            https://meteo.lcd.lu/2024_only.xlsx \
            https://meteo.lcd.lu/data/2024_only.xlsx \
            https://meteo.lcd.lu/datafile_description.xls \
            https://meteo.lcd.lu/data/datafile_description.xls ; do
            n=$(echo "$u" | sed 's#https://meteo.lcd.lu/##; s#/#_#g')
            curl -sSL -A "Mozilla/5.0" -o "$n" -w "$u %{http_code} %{size_download}\n" "$u" >> status.txt 2>&1 || true
            # 404-Seiten wieder löschen, große Dateien kürzen (nur Kopf + Ende behalten)
            if grep -q "404 Not Found" "$n" 2>/dev/null; then rm -f "$n"; fi
            if [ -f "$n" ] && [ $(stat -c %s "$n") -gt 400000 ]; then (head -c 200000 "$n"; echo; echo "...gekuerzt..."; tail -c 20000 "$n") > "$n.part" && rm "$n"; fi
          done
      - name: Ergebnis committen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/probe
          git commit -m "Probe meteoLCD: Testdateien" || echo "nichts zu committen"
          git push
